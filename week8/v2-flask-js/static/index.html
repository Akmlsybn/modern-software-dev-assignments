<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>📄 Notes Manager</h1>

      <!-- Form Create/Edit -->
      <div class="card" id="form-section">
        <h2 id="form-title">Create New Note</h2>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" placeholder="Enter note title" />
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea id="content" placeholder="Enter note content"></textarea>
        </div>
        <div class="form-buttons">
          <button class="btn-primary" onclick="saveNote()">Add Note</button>
          <button
            class="btn-cancel"
            id="cancel-btn"
            onclick="cancelEdit()"
            style="display: none"
          >
            Cancel
          </button>
        </div>
      </div>

      <!-- Notes List -->
      <div id="notes-list"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
